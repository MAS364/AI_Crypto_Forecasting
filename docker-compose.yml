# Runs the FastAPI backend and Streamlit frontend together.
#
# Usage:
#   docker compose up --build
#
# Then open http://localhost:8501 for Streamlit.
# The frontend talks to the API container at http://api:8080 internally.
# FastAPI docs are available externally at http://localhost:8000/docs.

services:
  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    ports:
      - "8000:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.streamlit
    ports:
      - "8501:8080"
    environment:
      - CRYPTO_API_URL=http://api:8080
    depends_on:
      api:
        condition: service_healthy